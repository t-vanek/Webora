services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webora
      POSTGRES_USER: webora
      POSTGRES_PASSWORD: webora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP catcher for development. Web UI/API at http://localhost:5099.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "2525:25"
      - "5099:80"

volumes:
  postgres-data:
